[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botquanganh-host-mcp"
version = "1.0.0"
description = "Host MCP server and bqa operations CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp==3.4.7",
  "httpx>=0.27,<1",
  "pyside6==6.11.2",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
bqa = "app.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.qml_ui" = ["qml/*.qml"]
