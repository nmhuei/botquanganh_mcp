[package]
name = "bqa-desktop"
version = "1.0.0"
edition = "2021"
authors = ["BQA Bridge Team"]
description = "Native Rust Studio App for BQA Bridge Center"

[dependencies]
tao = "0.31"
wry = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
chrono = "0.4"
notify = "6.1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.10"

[lib]
name = "bqa_core"
path = "src/lib.rs"

[[bin]]
name = "bqa-desktop"
path = "src/main.rs"

[[bin]]
name = "bqa-mcp"
path = "src/bin/mcp_server.rs"
