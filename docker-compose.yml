services:
  mcp-server:
    build: .
    container_name: fallback-runner-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount docker socket để điều khiển runner containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist logs
      - ./logs:/app/logs
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
