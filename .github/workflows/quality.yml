name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Prepare development configuration
        run: |
          cp .env.example .env
          sed -i 's/^REQUIRE_AUTH=true/REQUIRE_AUTH=false/' .env
          sed -i "s|^HOST_WORKSPACE_DIR=.*|HOST_WORKSPACE_DIR=$GITHUB_WORKSPACE|" .env
          chmod 600 .env

      - name: Install
        run: ./scripts/install_basic.sh

      - name: Quality gate
        run: ./scripts/quality_gate.sh

      - name: Installer manual regression
        run: ./scripts/manual_test_installer.sh
